<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 410" role="img" aria-labelledby="lat-title lat-desc" style="display:block;width:100%;height:auto;overflow:visible;">
    <title id="lat-title">Latch assembly viewed from above</title>
    <desc id="lat-desc">Top-down cutaway showing the gray slider inside a black U-shaped guide. The yellow flexure runs vertically along the outside right wall and its hook passes left through a wall opening into a gap in the gray slider rail. Pulling the flexure to the right withdraws the hook.</desc>
    <defs>
      <marker id="lat-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0 0 L9 4.5 L0 9 Z" fill="#111827"/>
      </marker>
    </defs>

    <!-- top-down black U-shaped jig -->
    <path d="M100 95 H600 V145 H155 V315 H600 V365 H100 Z" fill="#1f2937" stroke="#374151" stroke-width="2"/>

    <!-- right jig wall split around latch window -->
    <path d="M545 145 H600 V220 H545 Z M545 270 H600 V315 H545 Z" fill="#1f2937" stroke="#374151" stroke-width="2"/>

    <!-- gray slider -->
    <path d="M145 160 H552 V300 H145 Z" fill="#a3a3a3" stroke="#4b5563" stroke-width="2"/>
    <path d="M160 175 H530 V205 H160 Z" fill="#73777b" stroke="#4b5563" stroke-width="2"/>
    <!-- catch gap -->
    <path d="M475 175 H520 V205 H475 Z" fill="#ffffff" stroke="#4b5563" stroke-width="2" stroke-dasharray="5 4"/>

    <!-- yellow flexure outside right wall -->
    <path d="M615 120 H645 V340 H615 Z" fill="#facc15" stroke="#a16207" stroke-width="2"/>
    <path d="M585 225 H625 V265 H585 Z" fill="#facc15" stroke="#a16207" stroke-width="2"/>

    <!-- hook engagement -->
    <path d="M585 235 H520 V255 H585" fill="#fde047" stroke="#a16207" stroke-width="2"/>

    <!-- pull direction -->
    <path d="M645 245 H710" fill="none" stroke="#111827" stroke-width="2.5" marker-end="url(#lat-arrow)"/>
    <text x="610" y="385" fill="#111827" font-family="system-ui, sans-serif" font-size="15" font-weight="500">PULL YELLOW BAR RIGHT ~2 mm</text>

    <!-- drawer direction -->
    <path d="M175 330 H65" fill="none" stroke="#111827" stroke-width="2.5" marker-end="url(#lat-arrow)"/>
    <text x="60" y="350" fill="#111827" font-family="system-ui, sans-serif" font-size="15" font-weight="500">DRAWER OUT</text>

    <!-- labels -->
    <g fill="#111827" font-family="system-ui, sans-serif" font-size="15" font-weight="500">
      <text x="115" y="65">BLACK GUIDE JIG</text>
      <path d="M210 72 L230 96" fill="none" stroke="#111827" stroke-width="1.5"/>

      <text x="260" y="255">GRAY SLIDER</text>

      <text x="445" y="125">CATCH GAP</text>
      <path d="M495 132 L495 173" fill="none" stroke="#111827" stroke-width="1.5"/>

      <text x="620" y="85">YELLOW FLEXURE</text>
      <path d="M670 92 L638 120" fill="none" stroke="#111827" stroke-width="1.5"/>

      <text x="470" y="290">HOOK PASSES THROUGH WALL</text>
      <path d="M548 276 L548 257" fill="none" stroke="#111827" stroke-width="1.5"/>
    </g>
  </svg>