<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 410" role="img" aria-labelledby="las-title las-desc" style="display:block;width:100%;height:auto;overflow:visible;">
    <title id="las-title">Assembled latch-and-catch test</title>
    <desc id="las-desc">A black U-shaped guide contains a gray sliding drawer. A yellow flexible security bar stands along the outer right wall with its hooked end entering a gap in the gray drawer rail. Pulling the yellow bar outward releases the drawer.</desc>
    <defs>
      <marker id="las-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#111827" opacity=".75"/>
      </marker>
      <filter id="las-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#111827" flood-opacity=".18"/>
      </filter>
    </defs>

    <!-- black guide jig -->
    <g filter="url(#las-shadow)">
      <path d="M95 285 L500 285 L620 215 L215 215 Z" fill="#1f2937" stroke="#374151" stroke-width="2"/>
      <path d="M95 285 L95 325 L500 325 L500 285 Z" fill="#1f2937" stroke="#374151" stroke-width="2"/>
      <path d="M500 285 L620 215 L620 255 L500 325 Z" fill="#1f2937" stroke="#374151" stroke-width="2"/>
      <path d="M110 270 L110 230 L220 166 L220 207 Z" fill="#1f2937" stroke="#374151" stroke-width="2"/>
      <path d="M110 230 L515 230 L620 170 L220 166 Z" fill="#1f2937" stroke="#374151" stroke-width="2"/>
      <path d="M110 270 L110 230 L515 230 L515 270 Z" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    </g>

    <!-- gray slider -->
    <g filter="url(#las-shadow)">
      <path d="M165 272 L475 272 L570 218 L260 218 Z" fill="#a3a3a3" stroke="#4b5563" stroke-width="2"/>
      <path d="M165 272 L165 296 L475 296 L475 272 Z" fill="#73777b" stroke="#4b5563" stroke-width="2"/>
      <path d="M475 272 L570 218 L570 242 L475 296 Z" fill="#73777b" stroke="#4b5563" stroke-width="2"/>
      <!-- raised rail with catch gap -->
      <path d="M252 216 L444 216 L465 204 L273 204 Z" fill="#73777b" stroke="#4b5563" stroke-width="2"/>
      <path d="M492 216 L555 216 L576 204 L513 204 Z" fill="#73777b" stroke="#4b5563" stroke-width="2"/>
      <path d="M444 216 L492 216 L513 204 L465 204 Z" fill="#ffffff" stroke="#4b5563" stroke-width="2" stroke-dasharray="5 4"/>
    </g>

    <!-- yellow flexure outside right wall -->
    <g filter="url(#las-shadow)">
      <path d="M558 197 L588 180 L588 283 L558 300 Z" fill="#facc15" stroke="#a16207" stroke-width="2"/>
      <path d="M588 180 L599 186 L599 289 L588 283 Z" fill="#a16207" stroke="#a16207" stroke-width="2"/>
      <path d="M548 209 L562 201 L562 222 L548 230 Z" fill="#facc15" stroke="#a16207" stroke-width="2"/>
    </g>

    <!-- labels -->
    <g fill="#111827" font-family="system-ui, sans-serif" font-size="15" font-weight="500">
      <text x="68" y="365">BLACK JIG</text>
      <path d="M148 350 L180 317" fill="none" stroke="#111827" stroke-width="1.5"/>

      <text x="294" y="365">GRAY SLIDER</text>
      <path d="M374 349 L398 294" fill="none" stroke="#111827" stroke-width="1.5"/>

      <text x="594" y="105">YELLOW FLEXURE</text>
      <path d="M637 116 L594 181" fill="none" stroke="#111827" stroke-width="1.5"/>

      <text x="370" y="170">CATCH GAP</text>
      <path d="M446 174 L471 205" fill="none" stroke="#111827" stroke-width="1.5"/>
    </g>

    <!-- release direction -->
    <path d="M585 238 C635 230 670 210 704 183" fill="none" stroke="#111827" stroke-width="2.5" marker-end="url(#las-arrow)"/>
    <text x="617" y="260" fill="#111827" font-family="system-ui, sans-serif" font-size="15" font-weight="500">PULL OUTWARD ~2 mm</text>

    <!-- slider direction -->
    <path d="M170 306 L92 350" fill="none" stroke="#111827" stroke-width="2.5" marker-end="url(#las-arrow)"/>
    <text x="190" y="332" fill="#111827" font-family="system-ui, sans-serif" font-size="15" font-weight="500">SLIDER COMES OUT THIS END</text>
  </svg>